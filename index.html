<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding · Positivo S+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080b;
    --bg-elev:#111116;
    --bg-card:#17171d;
    --bg-card-hover:#1d1d24;
    --border:#26262f;
    --green:#22d66b;
    --green-dim:#17a854;
    --green-soft:rgba(34,214,107,.13);
    --pink:#ef1785;
    --pink-soft:rgba(239,23,133,.14);
    --amber:#f5a524;
    --amber-soft:rgba(245,165,36,.10);
    --amber-border:rgba(245,165,36,.4);
    --villain:#9b6bf3;
    --villain-soft:rgba(155,107,243,.13);
    --villain-border:rgba(155,107,243,.4);
    --light-card:#e9f3ec;
    --light-card-text:#0d1210;
    --text:#f3f3f6;
    --text-muted:#96969f;
    --text-faint:#5c5c66;
    --radius:20px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--green-soft);}

  /* ---------- TOP BAR ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;
    background:var(--bg-elev);
    border-bottom:1px solid var(--border);
    gap:16px;
    position:sticky;top:0;z-index:50;
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-left img{height:20px;width:auto;flex-shrink:0;}
  .topbar-crumb{font-size:13px;color:var(--text-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .lang-pills{display:flex;background:var(--bg-card);border:1px solid var(--border);border-radius:99px;padding:3px;}
  .lang-pill{padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--text-faint);}
  .lang-pill.active{background:var(--bg);color:var(--text);}
  .theme-dots{display:none;align-items:center;gap:6px;color:var(--text-faint);font-size:14px;}
  @media(min-width:640px){.theme-dots{display:flex;}}
  .xp-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--green-soft);color:var(--green);border:1px solid rgba(34,214,107,.35);
    padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700;
    transition:transform .25s;
  }
  .xp-pill.pulse{transform:scale(1.12);}
  .avatar-pill{width:30px;height:30px;border-radius:50%;background:var(--pink-soft);color:var(--pink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}

  /* ---------- APP LAYOUT ---------- */
  .app{display:flex;min-height:calc(100vh - 49px);}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:280px;flex-shrink:0;
    background:var(--bg-elev);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    padding:22px 16px;
    position:sticky;top:49px;
    height:calc(100vh - 49px);
    overflow-y:auto;
  }
  .progress-block{
    background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:14px 16px;margin-bottom:18px;
  }
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-bottom:8px;}
  .progress-label b{color:var(--green);font-weight:700;}
  .progress-track{height:6px;background:#26262f;border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

  .nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;
    color:var(--text-muted);font-size:13.5px;font-weight:500;
    border:1px solid transparent;transition:background .15s,color .15s,border-color .15s;
  }
  .nav-item:hover{background:var(--bg-card);color:var(--text);}
  .nav-item.active{background:var(--green-soft);color:var(--text);border-color:rgba(34,214,107,.35);}
  .nav-item.locked{cursor:not-allowed;opacity:.45;}
  .nav-item.locked:hover{background:transparent;color:var(--text-muted);}
  .nav-dot{
    width:22px;height:22px;flex-shrink:0;border-radius:50%;
    background:var(--bg-card);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-faint);font-weight:700;
  }
  .nav-item.active .nav-dot{background:var(--green);border-color:var(--green);color:#04160b;}
  .nav-item.done .nav-dot{background:transparent;border-color:var(--green);color:var(--green);}
  .nav-item.done .nav-dot svg{width:11px;height:11px;}
  .nav-item.locked .nav-dot{color:var(--text-faint);}
  .nav-item .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-item .meta{font-size:10.5px;color:var(--text-faint);flex-shrink:0;}

  .sidebar-foot{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .sidebar-foot img{width:36px;height:36px;border-radius:10px;object-fit:cover;}
  .sidebar-foot .txt{font-size:11.5px;color:var(--text-muted);line-height:1.4;}
  .sidebar-foot .txt b{color:var(--text);font-weight:700;display:block;font-size:12.5px;}

  /* ---------- MAIN ---------- */
  .main{flex:1;min-width:0;padding:40px 48px 80px;max-width:900px;}
  .crumb-back{
    display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);
    margin-bottom:18px;cursor:pointer;border:none;background:none;padding:0;
  }
  .crumb-back:hover{color:var(--text);}
  .module-meta-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-faint);margin-bottom:10px;}
  .module-meta-row .dot{width:3px;height:3px;border-radius:50%;background:var(--text-faint);}
  .eyebrow{font-size:12.5px;font-weight:700;color:var(--pink);letter-spacing:.02em;margin-bottom:10px;}
  .module-title{font-size:30px;font-weight:700;line-height:1.15;margin:0 0 14px;}
  .module-intro{font-size:15.5px;color:var(--text-muted);line-height:1.65;max-width:62ch;margin:0 0 30px;}
  .module-body{min-height:200px;}

  .footer-nav{display:flex;justify-content:space-between;align-items:center;margin-top:44px;padding-top:22px;border-top:1px solid var(--border);}
  .btn{
    font-size:14px;font-weight:700;padding:12px 22px;border-radius:99px;border:1px solid var(--border);
    background:var(--bg-card);color:var(--text);cursor:pointer;transition:background .15s,transform .1s,border-color .15s;
    display:inline-flex;align-items:center;gap:8px;
  }
  .btn:hover{background:var(--bg-card-hover);}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--green);border-color:var(--green);color:#04160b;}
  .btn-primary:hover{background:#3ee382;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted);}
  .btn-ghost:hover{color:var(--text);background:var(--bg-card);}

  /* ---------- RUSH WARNING BANNER ---------- */
  .rush-banner{
    background:var(--amber-soft);border:1px solid var(--amber-border);border-radius:var(--radius-sm);
    padding:16px 18px;margin-bottom:28px;position:relative;overflow:hidden;
  }
  .rush-banner .rb-head{display:flex;align-items:flex-start;gap:10px;}
  .rush-banner .rb-ico{color:var(--amber);font-size:17px;flex-shrink:0;margin-top:1px;}
  .rush-banner .rb-title{font-weight:700;font-size:14.5px;margin-bottom:4px;}
  .rush-banner .rb-body{font-size:13px;color:var(--text-muted);line-height:1.55;margin:0 0 6px;}
  .rush-banner .rb-note{font-size:12px;color:var(--text-faint);line-height:1.5;margin:0;}
  .rush-banner .rb-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:15px;}
  .rush-banner .rb-track{height:4px;background:rgba(245,165,36,.18);border-radius:99px;overflow:hidden;margin-top:12px;}
  .rush-banner .rb-fill{height:100%;background:var(--amber);border-radius:99px;transition:width .3s linear;}

  /* ---------- CARDS / COMPONENTS ---------- */
  .grid{display:grid;gap:14px;}
  .grid-2{grid-template-columns:1fr 1fr;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}

  .flip-card{perspective:1200px;height:168px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--border);padding:18px;display:flex;flex-direction:column;}
  .flip-front{background:var(--bg-card);justify-content:space-between;}
  .flip-back{background:var(--green-soft);border-color:rgba(34,214,107,.35);transform:rotateY(180deg);justify-content:center;}
  .flip-front .num{font-size:12px;color:var(--text-faint);font-weight:700;}
  .flip-front .name{font-size:16.5px;font-weight:700;font-family:'Space Grotesk',sans-serif;}
  .flip-front .hint{font-size:12px;color:var(--text-faint);}
  .flip-back p{font-size:13.5px;line-height:1.5;margin:0;color:var(--text);}

  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .tab-btn{padding:9px 16px;border-radius:99px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);font-weight:700;font-size:13.5px;cursor:pointer;}
  .tab-btn.active{background:var(--pink-soft);border-color:rgba(239,23,133,.4);color:var(--text);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .kv-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--text-muted);}
  .kv-row .v{font-weight:700;text-align:right;}

  .checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .checklist li{display:flex;gap:12px;align-items:flex-start;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;font-size:14px;line-height:1.5;}
  .checklist .ico{color:var(--green);flex-shrink:0;margin-top:1px;}
  .checklist.risk .ico{color:var(--villain);}

  .practice-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 18px;margin-bottom:10px;}
  .practice-item .stmt{font-size:14px;line-height:1.5;margin-bottom:12px;}
  .practice-choices{display:flex;gap:8px;}
  .choice-btn{flex:1;padding:9px;border-radius:9px;border:1px solid var(--border);background:var(--bg-elev);color:var(--text-muted);font-weight:700;font-size:13px;cursor:pointer;}
  .choice-btn:hover{border-color:var(--text-faint);}
  .practice-item.answered .choice-btn{cursor:default;pointer-events:none;}
  .practice-item.correct{border-color:rgba(34,214,107,.5);}
  .practice-item.wrong{border-color:rgba(239,23,133,.5);}
  .feedback{font-size:12.5px;margin-top:10px;line-height:1.5;display:none;}
  .practice-item.answered .feedback{display:block;}
  .feedback.good{color:var(--green);}
  .feedback.bad{color:var(--pink);}

  .quiz-q{margin-bottom:26px;}
  .quiz-q .qtext{font-size:15.5px;font-weight:700;margin-bottom:12px;font-family:'Space Grotesk',sans-serif;}
  .quiz-opts{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{text-align:left;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:14px;cursor:pointer;}
  .quiz-opt:hover{background:var(--bg-card-hover);}
  .quiz-opt.selected{border-color:var(--pink);background:var(--pink-soft);}
  .quiz-opt.correct{border-color:var(--green);background:var(--green-soft);}
  .quiz-opt.incorrect{border-color:var(--pink);background:var(--pink-soft);opacity:.7;}
  .quiz-locked .quiz-opt{pointer-events:none;}

  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:var(--green);border:1px solid rgba(34,214,107,.35);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;}
  .badge-villain{background:var(--villain-soft);color:var(--villain);border-color:var(--villain-border);}
  .badge-amber{background:var(--amber-soft);color:var(--amber);border-color:var(--amber-border);}

  /* light course-card (matches platform look) */
  .course-card{
    border-radius:24px;padding:28px;background:var(--light-card);color:var(--light-card-text);
    display:flex;align-items:center;gap:24px;margin-bottom:8px;position:relative;overflow:hidden;
  }
  .course-card::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;background:rgba(34,214,107,.18);}
  .course-card img{width:110px;height:110px;object-fit:contain;border-radius:18px;flex-shrink:0;position:relative;background:#fff;}
  .course-card .cc-txt{position:relative;}
  .course-card .cc-eyebrow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#1a7a45;margin-bottom:6px;}
  .course-card h1{font-size:26px;margin:0 0 8px;color:#0d1210;}
  .course-card p{color:#3c463f;font-size:14px;line-height:1.6;margin:0 0 14px;max-width:46ch;}
  .course-card .cc-meta{display:flex;gap:14px;font-size:12.5px;color:#3c463f;font-weight:600;flex-wrap:wrap;}

  .hero{
    border-radius:24px;padding:40px 36px;
    background:radial-gradient(circle at 15% 20%, rgba(239,23,133,.25), transparent 45%),
               radial-gradient(circle at 85% 80%, rgba(34,214,107,.22), transparent 50%),
               #0d0d12;
    border:1px solid var(--border);display:flex;align-items:center;gap:28px;margin-bottom:8px;
  }
  .hero img{width:140px;height:140px;object-fit:contain;flex-shrink:0;border-radius:18px;}
  .hero .htxt .kicker{color:var(--pink);font-weight:700;font-size:12.5px;margin-bottom:8px;}
  .hero .htxt h1{font-size:26px;margin:0 0 10px;}
  .hero .htxt p{color:var(--text-muted);font-size:14.5px;line-height:1.6;margin:0;max-width:48ch;}

  /* villain hero (Neecal) */
  .villain-hero{
    border-radius:24px;padding:32px;
    background:radial-gradient(circle at 80% 10%, rgba(155,107,243,.28), transparent 50%), #0c0a13;
    border:1px solid var(--villain-border);display:flex;align-items:center;gap:24px;margin-bottom:24px;
  }
  .villain-hero img{width:130px;border-radius:16px;flex-shrink:0;border:1px solid var(--villain-border);}
  .villain-hero h2{font-size:20px;margin:6px 0 8px;color:#e7dcff;}
  .villain-hero p{color:#b9aee0;font-size:13.5px;line-height:1.6;margin:0;}
  .villain-hero .vtag{color:var(--villain);font-weight:700;font-size:12px;letter-spacing:.02em;}

  .section-h{font-size:13px;font-weight:700;color:var(--text);margin:30px 0 12px;display:flex;align-items:center;gap:8px;}
  .section-h.villain-h{color:var(--villain);}
  .section-h:first-child{margin-top:0;}

  /* video block */
  .video-block{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--bg-card);margin-bottom:26px;}
  .video-embed{position:relative;width:100%;padding-top:56.25%;background:#000;}
  .video-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block;}

  .certificate{border-radius:24px;border:1px solid var(--border);background:linear-gradient(135deg,#0d0d12,#111116);padding:40px;text-align:center;position:relative;overflow:hidden;}
  .certificate::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%, rgba(34,214,107,.18), transparent 60%);}
  .certificate > *{position:relative;}
  .certificate img{width:96px;margin-bottom:14px;}
  .certificate h2{font-size:22px;margin:6px 0 4px;}
  .certificate p{color:var(--text-muted);font-size:14px;margin:0 0 4px;}

  .social-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px;}
  .social-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;display:flex;align-items:center;gap:12px;font-size:14px;}
  .social-card .si{width:36px;height:36px;border-radius:10px;background:var(--pink-soft);color:var(--pink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .social-card b{display:block;font-size:13.5px;}
  .social-card span{color:var(--text-faint);font-size:12px;}

  .contact-card{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:8px;font-size:13.5px;}
  .contact-card .ci{width:34px;height:34px;border-radius:9px;background:var(--villain-soft);color:var(--villain);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;}
  .contact-card b{display:block;font-size:13.5px;}
  .contact-card span{color:var(--text-faint);font-size:12px;}

  .steps{counter-reset:step;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .steps li{counter-increment:step;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px 14px 50px;position:relative;font-size:13.5px;line-height:1.55;}
  .steps li::before{content:counter(step);position:absolute;left:16px;top:14px;width:22px;height:22px;border-radius:50%;background:var(--villain-soft);color:var(--villain);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;}
  .steps li b{display:block;font-size:14px;margin-bottom:2px;}

  @media (max-width:880px){
    .app{flex-direction:column;}
    .topbar{padding:10px 14px;}
    .theme-dots{display:none;}
    .sidebar{position:relative;width:100%;height:auto;top:0;flex-direction:row;align-items:center;padding:12px 14px;gap:12px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);}
    .progress-block{display:none;}
    .sidebar-foot{display:none;}
    .nav-list{flex-direction:row;flex:none;}
    .nav-item .label,.nav-item .meta{display:none;}
    .main{padding:24px 16px 60px;max-width:100%;}
    .hero,.course-card,.villain-hero{flex-direction:column;text-align:center;padding:26px 20px;}
    .hero img,.villain-hero img{width:110px;height:110px;}
    .course-card img{width:90px;height:90px;}
    .grid-2,.grid-3{grid-template-columns:1fr;}
    .social-grid{grid-template-columns:1fr;}
    .module-title{font-size:24px;}
    .course-card .cc-meta{justify-content:center;}
  }

  /* READING GUARD */
  .reading-guard{display:flex;gap:12px;align-items:flex-start;background:var(--bg-card);border:1px solid var(--amber-border);border-radius:14px;padding:14px 16px;margin-top:18px;}
  .reading-guard.ok{background:var(--green-soft);border-color:rgba(34,214,107,.35);}
  .rg-ico{width:34px;height:34px;border-radius:50%;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .reading-guard.ok .rg-ico{background:var(--green-soft);}
  .rg-title{font-weight:700;font-size:13.5px;margin-bottom:4px;}
  .rg-body{font-size:12.5px;color:var(--text-muted);line-height:1.5;}
  .rg-track{height:6px;background:#26262f;border-radius:99px;margin-top:10px;overflow:hidden;}
  .rg-fill{height:100%;background:var(--amber);border-radius:99px;transition:width .4s;}
  .reading-guard.ok .rg-fill{background:var(--green);}

  /* QUIZ GUARD */
  .quiz-guard{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);font-size:12.5px;color:var(--text-muted);}

  /* CERTIFICATE */
  .cert-wrapper{position:relative;width:100%;max-width:900px;margin:20px auto;border-radius:16px;overflow:hidden;border:1px solid var(--border);background:#fff;}
  .cert-wrapper img{width:100%;display:block;}

/* ---------------- VIDEO BLOCK HELPER — CORREGIDO ---------------- */
function videoBlock(youtubeUrl){
  let videoId = '';
  try{
    const u = new URL(youtubeUrl);
    if(u.hostname.includes('youtu.be')){
      videoId = u.pathname.replace('/','').split('?')[0];
    }else{
      videoId = u.searchParams.get('v') || u.pathname.split('/').pop() || '';
    }
  }catch(e){
    videoId = (youtubeUrl.split('v=')[1]||'').split('&')[0] || youtubeUrl.split('/').pop() || '';
  }
  videoId = videoId.replace(/[^a-zA-Z0-9_\-]/g,'').slice(0,20);
  if(!videoId) videoId = 'Y-qJbPLAdT0';
  return `
  <div class="video-block" style="margin:18px 0 24px;">
    <div class="video-embed" style="position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--border);">
      <iframe 
        src="https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1&enablejsapi=0" 
        title="Video de bienvenida — Onboarding Positivo S+" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen 
        loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin"
        style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;">
      </iframe>
    </div>
    <div style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Si no ves el video, verifica que YouTube no esté bloqueado en tu red.</div>
  </div>`;
}

      return `<div id="quizWrap">

            <div class="quiz-opts">
              ${q.opts.map((o,oi)=>`<button class="quiz-opt" data-oi="${oi}">${o}</button>`).join('')}
            </div>
          </div>`).join('')}
        <button class="btn btn-primary" id="btnSubmitQuiz" style="margin-top:6px;">Ver resultado</button>
        <div id="quizResult" style="display:none;margin-top:22px;"></div>
      </div>`;
    },
    init: () => {
      const qs = QUIZ_QUESTIONS;
      document.querySelectorAll('#quizWrap .quiz-q').forEach(qEl=>{
        const qi = +qEl.dataset.qi;
        qEl.querySelectorAll('.quiz-opt').forEach(optEl=>{
          optEl.addEventListener('click', ()=>{
            if (quizState.submitted) return;
            qEl.querySelectorAll('.quiz-opt').forEach(o=>o.classList.remove('selected'));
            optEl.classList.add('selected');
            quizState.answers[qi] = +optEl.dataset.oi;
          });
        });
      });
      document.getElementById('btnSubmitQuiz').addEventListener('click', ()=>{
        let score = 0;
        qs.forEach((q,qi)=>{
          const qEl = document.querySelector(`.quiz-q[data-qi="${qi}"]`);
          qEl.classList.add('quiz-locked');
          qEl.querySelectorAll('.quiz-opt').forEach(optEl=>{
            const oi = +optEl.dataset.oi;
            if (oi === q.correct) optEl.classList.add('correct');
            else if (quizState.answers[qi] === oi) optEl.classList.add('incorrect');
          });
          if (quizState.answers[qi] === q.correct) score++;
        });
        quizState.submitted = true;
        const resEl = document.getElementById('quizResult');
        resEl.style.display = 'block';
        let msg, tone;
        if (score >= 6) { msg = '¡Excelente! Ya te mueves como un experto S+.'; tone = 'var(--green)'; }
        else if (score >= 4) { msg = 'Vas bien. Vale la pena repasar algún módulo antes de seguir.'; tone = 'var(--pink)'; }
        else { msg = 'Te recomendamos repasar los módulos anteriores antes de continuar.'; tone = 'var(--pink)'; }
        resEl.innerHTML = `<div class="card"><div style="font-size:26px;font-weight:700;font-family:'Space Grotesk',sans-serif;color:${tone};">${score}/${qs.length}</div><div style="color:var(--text-muted);font-size:14px;margin-top:6px;">${msg}</div></div>`;
        document.getElementById('btnSubmitQuiz').disabled = true;
        window.__quizScore = score;
        window.__quizTotal = qs.length;
      });
    }
  },

/* ---------------- NOMBRE DESDE SESION ---------------- */
function getStoredUserName(){
  try{
    const params = new URLSearchParams(window.location.search);
    let name = params.get('nombre') || params.get('name') || params.get('colaborador') || params.get('user') || '';
    if(!name) name = localStorage.getItem('onboarding_user_name') || sessionStorage.getItem('onboarding_user_name') || localStorage.getItem('colaborador_nombre') || localStorage.getItem('userName') || sessionStorage.getItem('userName') || '';
    if(!name && window.__USER_NAME__) name = window.__USER_NAME__;
    if(!name && window.__COLABORADOR__) name = window.__COLABORADOR__;
    return (name||'').trim();
  }catch(e){ return ''; }
}
function saveStoredUserName(name){
  try{
    localStorage.setItem('onboarding_user_name', name);
    sessionStorage.setItem('onboarding_user_name', name);
    localStorage.setItem('colaborador_nombre', name);
  }catch(e){}
}
function sanitizeName(name){ return name.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ\s\-\.']/g,'').trim().slice(0,80); }

/* ---------------- LECTURA OBLIGATORIA ---------------- */
let readingGuardInterval = null;
let readingObserver = null;
let readingState = { scrolledEnough:false, timeEnough:false, minTime:0, start:0, fullyUnlocked:false };

function cleanupReadingGuard(){
  if(readingGuardInterval) clearInterval(readingGuardInterval);
  readingGuardInterval = null;
  if(readingObserver){ readingObserver.disconnect(); readingObserver = null; }
  window.removeEventListener('scroll', onReadingScroll, true);
  const main = document.getElementById('main');
  if(main) main.removeEventListener('scroll', onReadingScroll, true);
}

function onReadingScroll(){
  const body = document.getElementById('moduleBody');
  const main = document.getElementById('main');
  if(!body) return;
  // calcula progreso de scroll dentro del contenido
  const mainTop = main ? main.scrollTop : 0;
  const winScroll = window.scrollY || document.documentElement.scrollTop;
  const scrollY = mainTop > 0 ? mainTop : winScroll;
  const viewport = main ? main.clientHeight : window.innerHeight;
  const total = body.scrollHeight - viewport + 100;
  let pct = total > 0 ? (scrollY / total) : 1;
  if(pct >= 0.85) readingState.scrolledEnough = true;
  updateReadingUI();
}

function updateReadingUI(){
  const btnNext = document.getElementById('btnNext');
  const slot = document.getElementById('readingGuardSlot');
  if(!slot) return;
  const elapsed = Math.floor((Date.now() - readingState.start)/1000);
  const needTime = readingState.minTime;
  const timeOk = elapsed >= needTime;
  if(timeOk) readingState.timeEnough = true;

  const canPass = readingState.scrolledEnough && readingState.timeEnough;
  readingState.fullyUnlocked = canPass;

  if(btnNext){
    btnNext.disabled = !canPass;
    if(!canPass){
      btnNext.title = !readingState.timeEnough ? `Debes permanecer al menos ${needTime}s leyendo (llevas ${elapsed}s)` : 'Debes llegar hasta el final del contenido haciendo scroll pausado';
    }else{
      btnNext.title = '';
    }
  }

  if(!canPass){
    slot.innerHTML = `
      <div class="reading-guard">
        <div class="rg-ico">📖</div>
        <div style="flex:1;">
          <div class="rg-title">Lectura obligatoria</div>
          <div class="rg-body">
            ${!readingState.timeEnough ? `Permanece <b>${needTime-elapsed}s más</b> en este módulo para validar lectura pausada.` : ''}
            ${!readingState.scrolledEnough ? `${!readingState.timeEnough ? '<br>' : ''}Haz scroll despacio hasta el final del contenido para habilitar <b>Siguiente</b>.` : '¡Casi listo!'}
          </div>
          <div class="rg-track"><div class="rg-fill" style="width:${Math.min(100, Math.round((elapsed/needTime)*100))}%"></div></div>
        </div>
      </div>`;
  }else{
    slot.innerHTML = `<div class="reading-guard ok"><div class="rg-ico">✅</div><div><div class="rg-title">Lectura validada</div><div class="rg-body">Ya puedes avanzar al siguiente módulo.</div></div></div>`;
  }
}


function setupQuizGuard(){
  const btnNext = document.getElementById('btnNext');
  if(btnNext) btnNext.disabled = true;
  const slot = document.getElementById('quizGuardSlot');
  const submitBtn = document.getElementById('btnSubmitQuiz');
  if(!submitBtn) return;

  function allAnswered(){
    return QUIZ_QUESTIONS.every((_,qi)=> typeof quizState.answers[qi] !== 'undefined');
  }
  function updateState(){
    const answered = Object.keys(quizState.answers).length;
    const total = QUIZ_QUESTIONS.length;
    const ok = allAnswered();
    if(slot){
      slot.innerHTML = ok ? `<div class="quiz-guard" style="border-color:rgba(34,214,107,.35);background:var(--green-soft);">✅ Respondiste ${answered}/${total}. Ya puedes <b>Enviar evaluación</b>.</div>` 
      : `<div class="quiz-guard">📝 Respondidas ${answered}/${total}. Debes responder todas para habilitar el envío.</div>`;
    }
    submitBtn.disabled = !ok;
    if(btnNext) btnNext.disabled = !quizState.submitted;
  }

  // monkey patch answer selection to update guard
  const orig = window.updateQuizGuard || function(){};
  window.updateQuizGuard = updateState;

  // observe clicks
  document.querySelectorAll('.quiz-opt').forEach(el=>{
    el.addEventListener('click', ()=> setTimeout(updateState, 50));
  });
  submitBtn.addEventListener('click', ()=>{
    setTimeout(()=>{
      const passed = (window.__quizScore||0) >= 6;
      if(slot){
        slot.innerHTML = `<div class="quiz-guard" style="${passed ? 'background:var(--green-soft);border-color:rgba(34,214,107,.35);' : ''}">Resultado: ${window.__quizScore}/${window.__quizTotal}. ${passed ? '✅ ¡Aprobado! Ya puedes avanzar al certificado.' : '⚠️ Necesitas al menos 6/8 para obtener el certificado. Repasa y vuelve a intentar.'}</div>`;
      }
      if(btnNext) btnNext.disabled = !passed;
      if(passed){
        unlockedUpTo = Math.max(unlockedUpTo, current+1);
        renderSidebarNav();
      }
    }, 150);
  });
  updateState();
}

  const passed = (window.__quizScore||0) >= 6 || completed.has('quiz');

    }

    const certEl = body.querySelector('.certificate, .cert-wrapper');
    if(certEl) certEl.style.display='none';
    return;
  }

  // Mostrar formulario de nombre y certificado real
  const certContainer = body.querySelector('#realCertContainer');
  if(!certContainer){
    // si no existe, lo creamos
    const wrapper = document.createElement('div');
    wrapper.id = 'realCertContainer';
    wrapper.innerHTML = `
      <div class="card" style="margin-top:16px;">
        <div style="font-weight:700;font-size:14px;margin-bottom:10px;">Datos del certificado</div>

      </div>
      <div id="certPreviewArea" style="margin-top:20px;"></div>
    `;
    body.appendChild(wrapper);

    const input = document.getElementById('certNameInput');
    const btn = document.getElementById('btnSaveName');
    const hint = document.getElementById('certNameHint');

    function renderCert(nameToUse){
      const clean = sanitizeName(nameToUse) || 'Nombre del colaborador';
      saveStoredUserName(clean);
      const area = document.getElementById('certPreviewArea');
      area.innerHTML = `
        <div class="cert-wrapper">
          <img src="${CERTIFICADO_BG_B64}" alt="Certificado Positivo S+">
          <div class="cert-name-overlay">${clean}</div>
        </div>
        <div class="cert-actions">
          <button id="btnDownloadCert" style="padding:10px 16px;border-radius:10px;background:var(--green);color:#04160b;border:none;font-weight:700;cursor:pointer;">⬇️ Descargar certificado (PNG)</button>
          <button id="btnPrintCert" style="padding:10px 16px;border-radius:10px;background:var(--bg-card);color:var(--text);border:1px solid var(--border);font-weight:600;cursor:pointer;">🖨️ Imprimir</button>
        </div>
        <div style="font-size:11.5px;color:var(--text-faint);margin-top:8px;">Certificado generado para <b style="color:var(--text)">${clean}</b> — ${new Date().toLocaleDateString('es-CO')}</div>
      `;
      document.getElementById('btnDownloadCert').addEventListener('click', ()=>{
        // descargar usando canvas
        const img = new Image();
        img.crossOrigin='anonymous';
        img.src = CERTIFICADO_BG_B64;
        img.onload = ()=>{
          const canvas = document.createElement('canvas');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img,0,0);
          // texto centrado en zona derecha
          const x = canvas.width * 0.71;
          const y = canvas.height * 0.485;
          ctx.fillStyle = '#0d3b1f';
          ctx.textAlign = 'center';
          ctx.font = `bold ${Math.round(canvas.width*0.032)}px 'Space Grotesk', sans-serif`;
          // wrap si muy largo
          const maxW = canvas.width*0.52;
          let lines = [];
          let words = clean.split(' ');
          let line = '';
          for(let w of words){
            let test = line ? line+' '+w : w;
            if(ctx.measureText(test).width > maxW){
              lines.push(line); line = w;
            }else line = test;
          }
          if(line) lines.push(line);
          let ly = y - ((lines.length-1)*18);
          lines.forEach(l=>{ ctx.fillText(l, x, ly); ly+= Math.round(canvas.width*0.038); });
          const a = document.createElement('a');
          a.download = `Certificado_Onboarding_${clean.replace(/\s+/g,'_')}.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        };
      });
      document.getElementById('btnPrintCert').addEventListener('click', ()=> window.print());
      if(btnNext) btnNext.disabled = false;
    }

    if(name){
      renderCert(name);
      hint.textContent = 'Nombre detectado desde tu sesión. Puedes corregirlo si es necesario y volver a generar.';
    }else{
      hint.textContent = 'No detectamos nombre en la sesión. Escríbelo arriba.';
    }

    btn.addEventListener('click', ()=>{
      const v = document.getElementById('certNameInput').value.trim();
      if(!v){ hint.textContent='Debes escribir tu nombre completo para generar el certificado.'; hint.style.color='var(--pink)'; return; }
      hint.style.color='var(--text-faint)';
      renderCert(v);
    });
  }
}

function setupReadingGuard(m){
  cleanupReadingGuard();
  readingState = { scrolledEnough:false, timeEnough:false, minTime:0, start:Date.now(), fullyUnlocked:false };
  const btnNext = document.getElementById('btnNext');
  const guardSlot = document.getElementById('readingGuardSlot');
  // módulos que no requieren guard de scroll
  if(['quiz','cierre'].includes(m.id)){
    if(btnNext) btnNext.disabled = false;
    if(guardSlot) guardSlot.innerHTML='';
    return;
  }
  // si el contenido es muy corto, solo exige tiempo
  const body = document.getElementById('moduleBody');
  const isShort = body ? body.scrollHeight < 400 : false;
  const thresholdSec = Math.min(90, Math.max(20, m.minutes * 60 * 0.28));
  readingState.minTime = thresholdSec;
  readingState.scrolledEnough = isShort; // si es corto, no exige scroll

  if(btnNext) btnNext.disabled = true;

  // observer del final
  const sentinel = document.getElementById('readSentinel');
  if(sentinel && 'IntersectionObserver' in window){
    readingObserver = new IntersectionObserver((entries)=>{
      entries.forEach(en=>{ if(en.isIntersecting){ readingState.scrolledEnough = true; updateReadingUI(); } });
    }, {threshold:0.5});
    readingObserver.observe(sentinel);
  }

  window.addEventListener('scroll', onReadingScroll, true);
  const main = document.getElementById('main');
  if(main) main.addEventListener('scroll', onReadingScroll, true);

  readingGuardInterval = setInterval(()=>{ updateReadingUI(); }, 800);
  updateReadingUI();
  onReadingScroll();
}

/* ---------------- FLIP-CARD HELPER ---------------- */
function bindFlip(selector){
  document.querySelectorAll(selector).forEach(el=>{
    el.addEventListener('click', ()=> el.classList.toggle('flipped'));
  });
}

/* ---------------- RUSH-TIMER / ANTI-CHEAT BANNER ---------------- */
function stopRushTimer(){
  if (rushInterval) clearInterval(rushInterval);
  rushInterval = null;
  document.removeEventListener('paste', onPaste);
  document.removeEventListener('visibilitychange', onVisibility);
}
function onPaste(){ pasteCount++; }
function onVisibility(){ if (document.hidden) blurCount++; }

function startRushTimer(m){
  moduleOpenedAt = Date.now();
  pasteCount = 0; blurCount = 0; rushDismissed = false;
  document.addEventListener('paste', onPaste);
  document.addEventListener('visibilitychange', onVisibility);

  const thresholdSec = Math.min(90, Math.max(20, m.minutes * 60 * 0.25));
  rushInterval = setInterval(()=> renderRushBanner(m, thresholdSec), 1000);
  renderRushBanner(m, thresholdSec);
}

function renderRushBanner(m, thresholdSec){
  const slot = document.getElementById('rushBannerSlot');
  if (!slot) { stopRushTimer(); return; }
  const elapsed = Math.floor((Date.now() - moduleOpenedAt)/1000);
  if (elapsed >= thresholdSec || rushDismissed){
    slot.innerHTML = '';
    if (elapsed >= thresholdSec) stopRushTimer();
    return;
  }
  const pct = Math.min(100, (elapsed/thresholdSec)*100);
  let extra = '';
  if (pasteCount > 0) extra += `Detectamos ${pasteCount} texto${pasteCount>1?'s':''} pegado${pasteCount>1?'s':''} en este módulo. `;
  if (blurCount > 0) extra += `Saliste de la pestaña ${blurCount} ${blurCount>1?'veces':'vez'} mientras estudiabas. `;
  slot.innerHTML = `
    <div class="rush-banner">
      <button class="rb-close" id="rbClose">✕</button>
      <div class="rb-head">
        <div class="rb-ico">⏱️</div>
        <div>
          <div class="rb-title">Estás pasando el módulo de afán</div>
          <p class="rb-body">Llevas ${elapsed}s de estudio activo sobre los ${m.minutes} min estimados. El tiempo real, hasta dónde bajas, el texto que pegas y las veces que sales de la pestaña quedan registrados y los ve tu capacitador. Terminar así paga ${Math.round(m.xp/2)} XP en vez de ${m.xp}.</p>
          <p class="rb-note">${extra}Si resuelves las actividades con ayuda de una IA, el patrón se nota aquí: lo que te evalúan después es lo que aprendiste, no lo que respondiste.</p>
        </div>
      </div>
      <div class="rb-track"><div class="rb-fill" style="width:${pct}%"></div></div>
    </div>`;
  const closeBtn = document.getElementById('rbClose');
  if (closeBtn) closeBtn.addEventListener('click', ()=>{ rushDismissed = true; slot.innerHTML=''; });
}

function isRushed(m){
  const elapsed = (Date.now() - moduleOpenedAt)/1000;
  const thresholdSec = Math.min(90, Math.max(20, m.minutes * 60 * 0.25));
  return elapsed < thresholdSec;
}

/* ---------------- XP ---------------- */
function awardXP(amount){
  xpTotal += amount;
  const val = document.getElementById('xpValue');
  const pill = document.getElementById('xpPill');
  val.textContent = xpTotal;
  pill.classList.add('pulse');
  setTimeout(()=> pill.classList.remove('pulse'), 300);
}

/* ---------------- RENDER ENGINE ---------------- */
function renderSidebarNav(){
  const list = document.getElementById('navList');
  list.innerHTML = modules.map((m,i)=>{
    const isActive = i===current;
    const isDone = completed.has(m.id);
    const isLocked = i > unlockedUpTo;
    const cls = ['nav-item'];
    if (isActive) cls.push('active');
    if (isDone) cls.push('done');
    if (isLocked) cls.push('locked');
    const dot = isLocked ? ICONS.lock : (isDone ? ICONS.check : (i+1));
    return `<li class="${cls.join(' ')}" data-i="${i}">
      <span class="nav-dot">${dot}</span>
      <span class="label">${m.label}</span>
      <span class="meta">${m.minutes} min</span>
    </li>`;
  }).join('');
  list.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = +el.dataset.i;
      if (i > unlockedUpTo) return;
      goTo(i);
    });
  });
  document.getElementById('progressCount').textContent = completed.size;
  document.getElementById('progressFill').style.width = (completed.size/modules.length*100)+'%';
}

function renderModule(){
  stopRushTimer();
  const m = modules[current];
  document.getElementById('topCrumb').textContent = `Onboarding · Latam 2028 / ${m.label}`;
  document.getElementById('moduleMetaRow').innerHTML = `<span>Módulo ${current+1} de ${modules.length}</span><span class="dot"></span><span>⏱ ~${m.minutes} min</span><span class="dot"></span><span>⚡ ${m.xp} XP</span>`;
  document.getElementById('moduleTitle').textContent = m.title;
  document.getElementById('moduleIntro').textContent = m.intro;
  document.getElementById('rushBannerSlot').innerHTML = '';
  const bodyEl = document.getElementById('moduleBody');
  bodyEl.innerHTML = m.render() + `<div id="readSentinel" style="height:2px;"></div><div id="readingGuardSlot"></div><div id="quizGuardSlot"></div>`;
  if (m.init) m.init();
  // setup guards después del render
  setTimeout(()=>{{
    if(m.id === 'quiz'){{
      setupQuizGuard();
    }}else if(m.id === 'cierre'){{
      setupCierreGuard();
    }}else{{
      setupReadingGuard(m);
    }}
  }}, 50);

  document.getElementById('btnPrev').disabled = current === 0;
  const btnNext = document.getElementById('btnNext');
  if (current === 0) btnNext.textContent = 'Empezar →';
  else if (current === modules.length-1) btnNext.textContent = 'Reiniciar recorrido';
  else btnNext.textContent = 'Siguiente →';

  renderSidebarNav();
  document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});

  startRushTimer(m);
}

function goTo(i){
  // bloquear salto a cierre si quiz no aprobado
  const target = modules[i];
  if(target && target.id === 'cierre'){
    const passed = (window.__quizScore||0) >= 6 || completed.has('quiz');
    if(!passed){
      alert('Debes aprobar la evaluación (mínimo 6/8) antes de ver el certificado.');
      return;
    }
  }
  current = Math.max(0, Math.min(modules.length-1, i));
  unlockedUpTo = Math.max(unlockedUpTo, current);
  renderModule();
}

document.getElementById('crumbBack').addEventListener('click', ()=> goTo(0));
document.getElementById('btnPrev').addEventListener('click', ()=> goTo(current-1));
document.getElementById('btnNext').addEventListener('click', ()=>{
  const m = modules[current];

  // Guard de lectura obligatoria
  if(!['quiz','cierre'].includes(m.id)){
    if(!readingState.fullyUnlocked){
      updateReadingUI();
      return;
    }
  }
  // Guard de quiz: no dejar avanzar si no aprobó
  if(m.id === 'quiz'){
    const passed = (window.__quizScore||0) >= 6;
    if(!quizState.submitted || !passed){
      const slot = document.getElementById('quizGuardSlot');
      if(slot) slot.innerHTML = `<div class="quiz-guard" style="border-color:var(--amber-border);">⚠️ Debes responder todas y obtener mínimo 6/8 para avanzar.</div>`;
      return;
    }
  }

  if (!completed.has(m.id)){
    completed.add(m.id);
    awardXP(isRushed(m) ? Math.round(m.xp/2) : m.xp);
  }
  if (current === modules.length-1){
    // No reiniciar automaticamente si ya tiene certificado, solo volver al inicio bajo confirmación
    if(confirm('¿Quieres reiniciar el recorrido? Se borrará tu progreso local.')){
      current = 0; unlockedUpTo = 0; completed.clear(); xpTotal = 0;
      document.getElementById('xpValue').textContent = 0;
      quizState.answers = {}; quizState.submitted = false;
      window.__quizScore = 0;
      cleanupReadingGuard();
      renderModule();
    }
    return;
  }
  unlockedUpTo = Math.max(unlockedUpTo, current+1);
  current += 1;
  renderModule();
});

renderModule();

</script>
